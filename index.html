    <script>
      // First visits start light and Indonesian. Stored choices win.
      // Stamps data-initial-theme / data-initial-locale so React's getInitial*()
      // reads the same values without duplicating the default logic.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          root.setAttribute('data-theme', t);
          root.setAttribute('data-initial-theme', t);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', t === 'dark' ? '#15181c' : '#f3f5f8');
          }

          var l = localStorage.getItem('portfolio-locale');
          if (l !== 'en' && l !== 'id') l = 'id';
          root.setAttribute('lang', l);
          root.setAttribute('data-initial-locale', l);
        } catch (e) {
          root.setAttribute('data-theme', 'light');
          root.setAttribute('data-initial-theme', 'light');
          root.setAttribute('lang', 'id');
          root.setAttribute('data-initial-locale', 'id');
        }
      })();
    </script>
