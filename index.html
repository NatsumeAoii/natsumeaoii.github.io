    <script>
      // Apply persisted/preferred theme & language before first paint to avoid flashes.
      // Stamps data-initial-theme / data-initial-locale so React's getInitial*()
      // reads the same values without duplicating detection logic.
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-initial-theme', t);

          var l = localStorage.getItem('portfolio-locale');
          if (l !== 'en' && l !== 'id') {
            l = (navigator.language || 'en').toLowerCase().indexOf('id') === 0 ? 'id' : 'en';
          }
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('data-initial-locale', l);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-initial-theme', 'dark');
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('data-initial-locale', 'en');
        }
      })();
    </script>
